spring.application.name=backend

# Conexion a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Seguridad JWT
app.jwt.secret=EsteEsUnSecretoMuyLargoParaFirmarTokensJwtDeLaboratorioPasteleria1234567890
app.jwt.expiration-minutes=60

server.port=8080
